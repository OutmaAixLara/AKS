apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app
spec:
  #replicas: 5
  selector:
    matchLabels:
      app: python-app
  template:
    metadata:
      labels:
        app: python-app
    spec:
      containers:
      - name: python-app
        image: moaix/python-app:latest
        ports:
        - containerPort: 5000
